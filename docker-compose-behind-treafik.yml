services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.7
    hostname: wazuh.manager
    restart: always
    networks:
      - wazuh-net
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    # ports:
    #   - "1514:1514"
    #   - "1515:1515"
    #   - "514:514/udp"
    #   - "55000:55000"
    environment:
      INDEXER_URL: ${INDEXER_URL}
      INDEXER_USERNAME: ${INDEXER_USERNAME}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: ${FILEBEAT_SSL_VERIFICATION_MODE:-full}
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: ${API_USERNAME}
      API_PASSWORD: ${API_PASSWORD}
    volumes:
      - ./data/wazuh-manager/api-configuration:/var/ossec/api/configuration
      - ./data/wazuh-manager/etc:/var/ossec/etc
      - ./data/wazuh-manager/logs:/var/ossec/logs
      - ./data/wazuh-manager/queue:/var/ossec/queue
      - ./data/wazuh-manager/var-multigroups:/var/ossec/var/multigroups
      - ./data/wazuh-manager/integrations:/var/ossec/integrations
      - ./data/wazuh-manager/active-response:/var/ossec/active-response/bin
      - ./data/wazuh-manager/agentless:/var/ossec/agentless
      - ./data/wazuh-manager/wodles:/var/ossec/wodles
      - ./data/filebeat/etc:/etc/filebeat
      - ./data/filebeat/var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wazuh-net"
      - "traefik.http.routers.wazuh-manager.rule=Host(`wazuh-manager.lab.local`)"
      - "traefik.http.routers.wazuh-manager.entrypoints=web"
      - "traefik.http.routers.wazuh-manager.service=wazuh-manager-api"
      - "traefik.http.services.wazuh-manager-api.loadbalancer.server.port=55000"
      - "traefik.http.services.wazuh-manager-api.loadbalancer.server.scheme=http"

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.7
    hostname: wazuh.indexer
    restart: always
    networks:
      - wazuh-net
    # ports:
    #   - "9200:9200"
    environment:
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data/wazuh-indexer:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wazuh-net"
      - "traefik.http.routers.wazuh-indexer.rule=Host(`wazuh-indexer.lab.local`)"
      - "traefik.http.routers.wazuh-indexer.entrypoints=web"
      - "traefik.http.routers.wazuh-indexer.service=wazuh-indexer-api"
      - "traefik.http.services.wazuh-indexer-api.loadbalancer.server.port=9200"
      - "traefik.http.services.wazuh-indexer-api.loadbalancer.server.scheme=http"

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    hostname: wazuh.dashboard
    restart: always
    networks:
      - wazuh-net
    environment:
      INDEXER_USERNAME: ${INDEXER_USERNAME}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD}
      WAZUH_API_URL: ${WAZUH_API_URL}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      API_USERNAME: ${API_USERNAME}
      API_PASSWORD: ${API_PASSWORD}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - ./data/wazuh-dashboard/config:/usr/share/wazuh-dashboard/data/wazuh/config
      - ./data/wazuh-dashboard/custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wazuh-net"
      - "traefik.http.routers.wazuh-dashboard.rule=Host(`${DASHBOARD_HOST}`)"
      - "traefik.http.routers.wazuh-dashboard.entrypoints=web"
      - "traefik.http.routers.wazuh-dashboard.service=wazuh-dashboard"
      - "traefik.http.services.wazuh-dashboard.loadbalancer.server.port=5601"
      - "traefik.http.services.wazuh-dashboard.loadbalancer.server.scheme=http"

  traefik:
    image: traefik:v3.7
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=wazuh-net"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      # - "443:443"
      - "8080:8080"
    networks:
      - wazuh-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-log:/var/log/traefik

networks:
  wazuh-net:
    driver: bridge
